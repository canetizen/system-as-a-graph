services:
  api:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-api-dev
    depends_on:
      postgres:
        condition: service_healthy
      cmdb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://saag:saag@postgres:5432/saag
      MSD_OUTPUT_DIR: /var/lib/saag/msd
      MSD_WORKSPACE_DIR: /var/lib/saag/workspace
      MSD_SOURCE_SEED_FILE: /app/tests/standins/sources.json
      VAE_JWT_SECRET: ${VAE_JWT_SECRET:-development-only-secret-replace-via-dotenv}
      VAE_SOURCE_STREAM_SECONDS: ${VAE_SOURCE_STREAM_SECONDS:-15}
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN_TEMPLATE: uid={username},ou=people,dc=saag,dc=local
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=saag,dc=local
      LDAP_SERVICE_BIND_DN: cn=admin,dc=saag,dc=local
      LDAP_SERVICE_PASSWORD: ${LDAP_ADMIN_PASSWORD:-saag-standin-admin}
      LDAP_GROUP_AUTHORIZATIONS: view=saag-viewers,configure_sources=saag-operators,produce_model_setup_data=saag-operators
      MSD_CMDB_PRIMARY_SECRET: ${MSD_CMDB_PRIMARY_SECRET:-saag}
      MSD_ARTIFACTORY_TOKEN: ${MSD_ARTIFACTORY_TOKEN:-standin-registry-token}
      # Where the stand-in external systems answer inside this network. Read by
      # the acceptance test, which rewrites the seeded addresses to them.
      STANDIN_CMDB_URL: mysql+pymysql://saag:saag@cmdb:3306/cmdb
      STANDIN_GIT_URL: http://gitea:3000
      STANDIN_PACKAGE_REGISTRY_URL: http://package-registry:8100
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - msd-output-dev:/var/lib/saag/msd
      - msd-workspace-dev:/var/lib/saag/workspace
      - ./tests/standins/ansible:/etc/saag/ansible:ro

  worker:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-worker-dev
    depends_on:
      postgres:
        condition: service_healthy
      cmdb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://saag:saag@postgres:5432/saag
      MSD_OUTPUT_DIR: /var/lib/saag/msd
      MSD_WORKSPACE_DIR: /var/lib/saag/workspace
      MSD_SOURCE_SEED_FILE: /app/tests/standins/sources.json
      VAE_JWT_SECRET: ${VAE_JWT_SECRET:-development-only-secret-replace-via-dotenv}
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN_TEMPLATE: uid={username},ou=people,dc=saag,dc=local
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=saag,dc=local
      LDAP_SERVICE_BIND_DN: cn=admin,dc=saag,dc=local
      LDAP_SERVICE_PASSWORD: ${LDAP_ADMIN_PASSWORD:-saag-standin-admin}
      MSD_CMDB_PRIMARY_SECRET: ${MSD_CMDB_PRIMARY_SECRET:-saag}
      MSD_ARTIFACTORY_TOKEN: ${MSD_ARTIFACTORY_TOKEN:-standin-registry-token}
    volumes:
      - .:/app
      - msd-output-dev:/var/lib/saag/msd
      - msd-workspace-dev:/var/lib/saag/workspace
      - ./tests/standins/ansible:/etc/saag/ansible:ro
    command: ["procrastinate", "--app=saag_platform.worker.app", "worker"]

  postgres:
    image: postgres:16-alpine
    container_name: saag-postgres-dev
    environment:
      POSTGRES_USER: saag
      POSTGRES_PASSWORD: saag
      POSTGRES_DB: saag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saag -d saag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data

  # --- Stand-in external systems -------------------------------------------
  # Real technologies holding demo data. They exist so the adapters can speak
  # their true protocols in development; production points the same adapters at
  # the customer's own servers and none of this is deployed.

  cmdb:
    image: mysql:8
    container_name: saag-cmdb-dev
    environment:
      MYSQL_ROOT_PASSWORD: saag-root
      MYSQL_DATABASE: cmdb
      MYSQL_USER: saag
      MYSQL_PASSWORD: ${MSD_CMDB_PRIMARY_SECRET:-saag}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u saag -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./tests/standins/cmdb:/docker-entrypoint-initdb.d:ro
      - cmdb-data-dev:/var/lib/mysql

  gitea:
    image: gitea/gitea:1.22
    container_name: saag-gitea-dev
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__server__ROOT_URL: http://gitea:3000/
    ports:
      # Host port only for looking at it; everything inside talks to gitea:3000.
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - gitea-data-dev:/data

  # The unit trees the git stand-in serves are MSD's published test data, so they
  # come from the distribution that publishes them. Copied into a volume because
  # only the CSCI image has that distribution installed, and the seeder is an
  # ordinary git client.
  standin-units:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-standin-units-dev
    command:
      - "python"
      - "-c"
      - |
        import os, shutil
        import saag_msd.testing as testing
        trees = os.path.join(os.path.dirname(testing.__file__), "data", "source_repository")
        shutil.copytree(trees, "/units", dirs_exist_ok=True)
        print("unit trees:", sorted(os.listdir("/units")))
    volumes:
      - standin-units:/units

  gitea-seed:
    image: alpine/git:latest
    container_name: saag-gitea-seed-dev
    depends_on:
      gitea:
        condition: service_healthy
      standin-units:
        condition: service_completed_successfully
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-saag}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-saag-standin-password}
      SOURCE_ROOT: /units
      # Written inside the container, never into the working tree: the token is
      # issued per run and a copy in the repository would be a committed secret.
      GITEA_TOKEN_FILE: /tmp/gitea-token
    volumes:
      - ./tests/standins:/standins:ro
      - standin-units:/units:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && sh /standins/git/seed.sh"]

  openldap:
    image: osixia/openldap:1.5.0
    container_name: saag-openldap-dev
    environment:
      LDAP_ORGANISATION: SaaG stand-in
      LDAP_DOMAIN: saag.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-saag-standin-admin}
    ports:
      - "389:389"
    # --copy-service applies the bootstrap LDIF mounted below on first start.
    command: ["--copy-service"]
    volumes:
      - ./tests/standins/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  package-registry:
    build:
      context: .
      target: dev
    image: saag-api:dev
    container_name: saag-package-registry-dev
    environment:
      # This stand-in is a module under tests/, which is not a distribution, so
      # unlike the CSUs it is reached through the path rather than an install.
      PYTHONPATH: /app
      PACKAGE_REGISTRY_ARTIFACTS: /app/tests/standins/package_registry/artifacts.json
      PACKAGE_REGISTRY_TOKEN: ${MSD_ARTIFACTORY_TOKEN:-standin-registry-token}
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    command:
      - "uvicorn"
      - "tests.standins.package_registry.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8100"

  web:
    build:
      context: ./web
      target: dev
    image: saag-web:dev
    container_name: saag-web-dev
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  standin-units:
  postgres-data-dev:
  msd-output-dev:
  msd-workspace-dev:
  cmdb-data-dev:
  gitea-data-dev:
