# Stand-in Ansible inventory (EXT-IF-04).
#
# One group per platform: this is how a tree that describes several platforms
# tells them apart, and it is the group MSD reads for the selected platform.
all:
  children:
    avionics:
      hosts:
        console-1:
          ansible_host: 10.20.0.11
        console-2:
          ansible_host: 10.20.0.12
    ground-station:
      hosts:
        gs-console-1:
          ansible_host: 10.30.0.11
