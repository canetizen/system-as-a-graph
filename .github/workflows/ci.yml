name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      # A distribution that only builds inside a workspace is not one.
      - name: Build the wheel
        run: uv build --wheel
