name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each CSU's own lint, test and build run in its own repository's workflow; what
# runs here is only what needs the CSUs assembled.
env:
  UV_GIT_LFS: "0"

jobs:
  csci:
    name: CSCI (lint + composition tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Assemble the CSCI
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Asserts the deployed composition is the one this repository declares, and
      # that the CSCI it composes serves what its CSUs publish.
      - name: Test
        run: uv run pytest

  acceptance:
    name: Acceptance (Increment 1 demo)
    runs-on: ubuntu-latest
    # The demo needs all four external systems and the directory, so it runs
    # against the stand-in stack rather than against service containers: the point
    # is to exercise the assembled CSCI the way an operator meets it.
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stand-in stack
        run: docker compose -f compose.dev.yml up -d --wait api worker postgres cmdb gitea openldap package-registry

      # Takes the unit trees from saag-msd's published test data, so the step
      # depends on the CSCI image rather than on anything in this repository.
      - name: Seed the stand-in git server
        run: docker compose -f compose.dev.yml up gitea-seed

      - name: Run the demo
        run: docker compose -f compose.dev.yml exec -T api python -m pytest tests/acceptance -v

      # The same demo as an operator performs it. Run from the web image, which
      # carries the browser, against the published ports rather than inside the
      # compose network: the page's own origin has to be the one the CSCI was told
      # to answer, and the browser has to reach the API at the address the page
      # was built with.
      - name: Run the demo through the browser
        run: |
          docker compose -f compose.dev.yml up -d --wait web
          docker run --rm --network host \
            -e PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser \
            -e SAAG_CSCI_URL=http://localhost:8000 \
            saag-web:dev npx playwright test

      - name: Report the composition on failure
        if: failure()
        run: |
          curl -s http://localhost:8000/platform/components || true
          docker compose -f compose.dev.yml logs --tail=80 api worker

      - name: Tear down
        if: always()
        run: docker compose -f compose.dev.yml down -v

  images:
    name: Images (compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose build

      - name: Build development images
        run: docker compose -f compose.dev.yml build
