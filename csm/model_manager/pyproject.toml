[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saag-csm-model-manager"
version = "0.1.0"
description = "SaaG-CSM: Model Manager (CSU CSM-01)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "saag-contracts>=0.1,<1",
    "iPOPO>=3.2,<4",
    "fastapi",
]

[project.urls]
Repository = "https://github.com/onuralpyigit/system-as-a-graph"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[project.entry-points."saag.bundles"]
csm-01 = "saag_csm_model_manager.bundle"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
