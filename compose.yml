services:
  api:
    build:
      context: .
      target: prod
    image: saag-api
    container_name: saag-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://saag:saag@postgres:5432/saag}
      MSD_OUTPUT_DIR: /var/lib/saag/msd
      MSD_WORKSPACE_DIR: /var/lib/saag/workspace
      # No stand-in systems here: production points the adapters at the
      # deployment's own servers, configured through the source configuration
      # screen or a seed file mounted alongside.
      MSD_SOURCE_SEED_FILE: ${MSD_SOURCE_SEED_FILE:-}
      MSD_RULES_FILE: ${MSD_RULES_FILE:-}
      # Without this the CSCI answers no browser, so the web application below
      # cannot call it. Named by the deployment because it is the origin the
      # panel is actually served from.
      WEB_ORIGINS: ${WEB_ORIGINS:?name the origin the web application is served from}
      VAE_JWT_SECRET: ${VAE_JWT_SECRET:?set a signing secret in .env}
      VAE_SESSION_MINUTES: ${VAE_SESSION_MINUTES:-480}
      VAE_SOURCE_STREAM_SECONDS: ${VAE_SOURCE_STREAM_SECONDS:-15}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN_TEMPLATE: ${LDAP_BIND_DN_TEMPLATE:-}
      LDAP_GROUP_SEARCH_BASE: ${LDAP_GROUP_SEARCH_BASE:-}
      LDAP_SERVICE_BIND_DN: ${LDAP_SERVICE_BIND_DN:-}
      LDAP_SERVICE_PASSWORD: ${LDAP_SERVICE_PASSWORD:-}
      LDAP_GROUP_AUTHORIZATIONS: ${LDAP_GROUP_AUTHORIZATIONS:-}
    volumes:
      - msd-output:/var/lib/saag/msd
      - msd-workspace:/var/lib/saag/workspace
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      target: prod
    image: saag-api
    container_name: saag-worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://saag:saag@postgres:5432/saag}
      MSD_OUTPUT_DIR: /var/lib/saag/msd
      MSD_WORKSPACE_DIR: /var/lib/saag/workspace
      MSD_SOURCE_SEED_FILE: ${MSD_SOURCE_SEED_FILE:-}
      MSD_RULES_FILE: ${MSD_RULES_FILE:-}
      VAE_JWT_SECRET: ${VAE_JWT_SECRET:?set a signing secret in .env}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN_TEMPLATE: ${LDAP_BIND_DN_TEMPLATE:-}
      LDAP_GROUP_SEARCH_BASE: ${LDAP_GROUP_SEARCH_BASE:-}
      LDAP_SERVICE_BIND_DN: ${LDAP_SERVICE_BIND_DN:-}
      LDAP_SERVICE_PASSWORD: ${LDAP_SERVICE_PASSWORD:-}
    volumes:
      - msd-output:/var/lib/saag/msd
      - msd-workspace:/var/lib/saag/workspace
    command: ["procrastinate", "--app=saag_platform.worker.app", "worker"]

  postgres:
    image: postgres:16-alpine
    container_name: saag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saag}
      POSTGRES_DB: ${POSTGRES_DB:-saag}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saag} -d ${POSTGRES_DB:-saag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # The web application is a repository of its own, like every distribution this
  # stack composes, so its build context is that repository rather than a directory.
  web:
    build:
      context: https://github.com/canetizen/saag_web.git
      target: prod
    image: saag-web
    container_name: saag-web
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  msd-output:
  msd-workspace:
