[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saag-msd"
version = "0.1.0"
description = "SaaG-MSD: Model Setup Data Generation (CSU MSD)"
requires-python = ">=3.11"
dependencies = [
    "saag-contracts",
    "iPOPO>=3.2,<4",
    "fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[project.entry-points."saag.bundles"]
msd = "saag_msd.bundle"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
saag-contracts = { workspace = true }
