# Workspace root. This is deliberately not a distribution: every CSU, the shared
# contracts package and the platform host are separate distributions, listed as
# workspace members below, so each one can move to its own repository unchanged.
[tool.uv.workspace]
members = [
    "contracts",
    "platform_host",
    "msd",
    "scg",
    "frd",
    "adp",
    "csm/model_manager",
    "csm/data_binder",
    "vae/operations_panel",
    "vae/design_verifier",
    "vae/design_analyzer",
    "vae/design_evaluator",
]

# Resolves the members' dependency on the shared contracts locally. Declared here
# rather than in each member so a member's own file states only what is true of it
# in any repository — which is what lets it move to one unchanged.
[tool.uv.sources]
saag-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.ruff]
target-version = "py311"
# Members use a src layout, so first-party packages are not directly under the
# repository root; without this, import sorting would treat a member's own package
# as a third-party dependency.
#
# `contracts/src` is deliberately absent: the shared contracts are a dependency of
# every CSU rather than part of one, so they must sort as third-party here exactly
# as they will once a CSU is a repository of its own. `contracts/` carries its own
# [tool.ruff] table for the same reason — inside it, they are first-party.
src = [
    "platform_host/src",
    "msd/src",
    "scg/src",
    "frd/src",
    "adp/src",
    "csm/model_manager/src",
    "csm/data_binder/src",
    "vae/operations_panel/src",
    "vae/design_verifier/src",
    "vae/design_analyzer/src",
    "vae/design_evaluator/src",
]

# Members carry their own testpaths so `cd <member> && pytest` works standalone;
# this root list is the whole-repository run. importlib import mode keeps the
# identically named per-member test modules from colliding.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
testpaths = [
    "tests",
    "contracts/tests",
    "platform_host/tests",
    "msd/tests",
    "scg/tests",
    "frd/tests",
    "adp/tests",
    "csm/model_manager/tests",
    "csm/data_binder/tests",
    "vae/operations_panel/tests",
    "vae/design_verifier/tests",
    "vae/design_analyzer/tests",
    "vae/design_evaluator/tests",
]
