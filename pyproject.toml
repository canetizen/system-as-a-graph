# The SaaG CSCI's integration repository. It publishes no distribution of its own:
# it says which versions of the CSU distributions make up a deployment, holds the
# documents and the deployment stack, and carries the tests that can only be run
# against the assembled CSCI.
[project]
name = "saag"
version = "0.1.0"
description = "System as a Graph — CSCI integration, deployment and documentation"
requires-python = ">=3.11"
license = "Apache-2.0"

# The composition. Installing these is what makes a CSCI: the framework host
# discovers whichever of them are present through their `saag.bundles` entry
# points, so this list *is* the deployed set of CSUs (SDD §2.5).
dependencies = [
    "saag-contracts>=0.1,<1",
    "saag-platform>=0.1,<1",
    "saag-msd>=0.1,<1",
    "saag-scg>=0.1,<1",
    "saag-frd>=0.1,<1",
    "saag-adp>=0.1,<1",
    "saag-csm-model-manager>=0.1,<1",
    "saag-csm-data-binder>=0.1,<1",
    "saag-vae-operations-panel>=0.1,<1",
    "saag-vae-design-verifier>=0.1,<1",
    "saag-vae-design-analyzer>=0.1,<1",
    "saag-vae-design-evaluator>=0.1,<1",
]

[project.urls]
Repository = "https://github.com/canetizen/saag"

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

# Where each distribution comes from. Until there is a package index to publish to
# (CDR-31), each is resolved from its own repository — which is also what keeps
# this file the single place a deployment's composition is decided. Replacing a
# `git` entry with an index version is the whole of that migration.
#
# To work on a CSU alongside the CSCI, point its entry at a local checkout:
#   saag-msd = { path = "../saag_msd", editable = true }
[tool.uv.sources]
saag-contracts = { git = "https://github.com/canetizen/saag_contracts.git", branch = "main" }
saag-platform = { git = "https://github.com/canetizen/saag_platform.git", branch = "main" }
saag-msd = { git = "https://github.com/canetizen/saag_msd.git", branch = "main" }
saag-scg = { git = "https://github.com/canetizen/saag_scg.git", branch = "main" }
saag-frd = { git = "https://github.com/canetizen/saag_frd.git", branch = "main" }
saag-adp = { git = "https://github.com/canetizen/saag_adp.git", branch = "main" }
saag-csm-model-manager = { git = "https://github.com/canetizen/saag_csm_model_manager.git", branch = "main" }
saag-csm-data-binder = { git = "https://github.com/canetizen/saag_csm_data_binder.git", branch = "main" }
saag-vae-operations-panel = { git = "https://github.com/canetizen/saag_vae_operations_panel.git", branch = "main" }
saag-vae-design-verifier = { git = "https://github.com/canetizen/saag_vae_design_verifier.git", branch = "main" }
saag-vae-design-analyzer = { git = "https://github.com/canetizen/saag_vae_design_analyzer.git", branch = "main" }
saag-vae-design-evaluator = { git = "https://github.com/canetizen/saag_vae_design_evaluator.git", branch = "main" }

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: exercises a real external system; skipped unless one is configured",
]
