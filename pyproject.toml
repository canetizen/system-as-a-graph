[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saag-vae-design-evaluator"
version = "0.1.0"
description = "SaaG-VAE: Design Evaluator (CSU VAE-04)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
