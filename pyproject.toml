[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saag-vae-operations-panel"
version = "0.1.0"
description = "SaaG-VAE: Operations Panel (CSU VAE-01)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "saag-contracts>=0.1,<1",
    "iPOPO>=3.2,<4",
    "fastapi",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "ldap3",
]

[project.urls]
Repository = "https://github.com/onuralpyigit/system-as-a-graph"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[project.entry-points."saag.bundles"]
vae-01 = "saag_vae_operations_panel.bundle"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saag_vae_operations_panel = ["testing/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
